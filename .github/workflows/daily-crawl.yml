name: Daily Webtoon Data Update

on:
  schedule:
    - cron: '0 15 * * *'  # UTC 15:00 = KST 00:00 매일 자정
  workflow_dispatch:       # 수동 실행 가능

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run crawler
        run: python crawler.py

      - name: Convert data to JS
        run: python convert_data.py

      - name: Check for changes
        id: check
        run: |
          git diff --quiet data.js webtoons.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & Push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js webtoons.json
          git commit -m "chore: 일일 웹툰 데이터 자동 업데이트 ($(date +'%Y-%m-%d'))"
          git push
